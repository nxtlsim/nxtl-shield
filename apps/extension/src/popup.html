<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NXTL Shield</title>
    <style>
      body { font: 14px/1.4 Inter, sans-serif; margin: 0; padding: 12px; width: 320px; background: #0a0c12; color: #fff; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      label { display: flex; gap: 8px; align-items: center; min-height: 44px; }
      button { min-height: 44px; border-radius: 999px; border: 0; background: #d80044; color: #fff; padding: 0 12px; }
      p { color: #949aa5; }
      a { color: #ff8a9a; }
    </style>
  </head>
  <body>
    <h1>NXTL Shield</h1>
    <p id="engine">Reading the extension…</p>
    <label><input id="blocking" type="checkbox" /> Threat blocking <span class="scope">this browser</span></label>
    <label><input id="trackers" type="checkbox" /> Tracker domains</label>
    <label><input id="cleaning" type="checkbox" /> URL cleaning</label>
    <label><input id="cosmetic" type="checkbox" /> Hide cookie banners (does not reject)</label>
    <p id="location"></p>
    <button id="pause" type="button">Pause 5 minutes</button>
    <button id="resume" type="button">Resume</button>
    <p>Pause stops Shield's request rules. It does not change DNS or a location block.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
