<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NXTL Shield Warning</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0c12;
        --card: #161922;
        --raised: #1d212e;
        --line: rgba(255, 255, 255, 0.08);
        --text: #ffffff;
        --muted: #949aa5;
        --accent-coral: #ff3d5a;
        --accent-mag: #d80044;
        --danger: #ff3d5a;
        --danger-bg: rgba(255, 61, 90, 0.12);
        --gradient: linear-gradient(135deg, #ff3d5a 0%, #d80044 100%);
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      main {
        max-width: 540px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--danger);
        border-radius: 4px;
        padding: 32px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      }
      .icon-shield {
        width: 52px;
        height: 52px;
        border-radius: 2px;
        background: var(--danger-bg);
        color: var(--danger);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin: 0 0 12px;
        color: var(--text);
      }
      p {
        color: var(--muted);
        margin: 0 0 16px;
      }
      code {
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 14px;
        background: var(--raised);
        padding: 10px 14px;
        border-radius: 2px;
        border: 1px solid var(--line);
        display: block;
        overflow-wrap: anywhere;
        word-break: break-all;
        color: var(--accent-coral);
        margin-bottom: 20px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        margin-top: 24px;
      }
      button {
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 2px;
        border: 1px solid var(--line);
        background: var(--raised);
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, transform 0.1s;
      }
      button:hover {
        background: #272d3e;
      }
      button:active {
        transform: translateY(1px);
      }
      button#back {
        background: var(--gradient);
        border: none;
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(216, 0, 68, 0.3);
        width: 100%;
      }
      button.text-link {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        padding: 4px 0;
        min-height: auto;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      button.text-link:hover {
        background: transparent;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon-shield">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <h1 id="title">Dangerous website blocked</h1>
      <p id="why">This website is cataloged as a known phishing or malware threat. Opening it could compromise your credentials or device.</p>
      <p><code id="url"></code></p>
      <p id="missing" hidden>The original address was not captured. Use your browser's back button.</p>
      <div class="actions">
        <button id="back" type="button">Go back (recommended)</button>
        <button id="once" class="text-link" type="button">Continue anyway</button>
      </div>
    </main>
    <script type="module" src="warning.js"></script>
  </body>
</html>
